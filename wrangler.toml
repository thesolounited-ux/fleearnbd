name = "fleearn156"
main = "./src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "fleearnd1"
database_id = "fleearnd1"

[[r2_buckets]]
binding = "R2_STORAGE"
bucket_name = "fleearn-storage"

[vars]
ENVIRONMENT = "production"
NODE_ENV = "production"
